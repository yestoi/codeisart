# The Pi 5 at the wall: the Colorlight card on eth0 and the AI Camera read as a plain camera through picamera2
# (the pose runs in MediaPipe on the Pi). Every other key is its default.
# Start it as docs/runbooks/arcade-on-the-pi.md says.
backend = "colorlight"
capture = "picamera2"
camera_fps = 15       # the Pi's steady pose rate: a result costs about 58 ms, so 20 asked gives 16 with jitter
                      # and 15 asked gives 15 (measured at the wall, 2026-10-02); 10 looked choppy to the owner
gamma = 1.0           # the card applies gamma: wall_pattern.py gamma's checker matched the RIGHT patch (2026-10-02)
