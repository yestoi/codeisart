# Feel budgets per GameInfo.kind (spec 9.3), read by arcade/feel.py. Each metric is a table with min and/or
# max. [<kind>.layouts."<WxH>".<metric>] overrides one metric at one layout; a game's own overrides live in
# arcade/games/<name>_feel.toml, each with a reason. The numbers are an owner question, defaulted: 2 ticks,
# 12 px and rounds of 20 to 120 s are spec 11's; the win bands are good >= 0.7, lazy 0.1 to 0.7, none <= 0.05.
# A score shows on four ticks in five (the ball and a goal's shake may hide it briefly) and reads at 5 m: nine in
# ten of its glyph's pixels survive the distance look, as 2x digits do at 10 m, the distance spec 7.4 says they
# read to. presence_answer_seconds is measured with no budget: it is not spec 9.3's idle hint.

[control.response_ticks]
max = 2

[control.fidelity]
min = 0.8

[control.range]
min = 0.6

[control.lit_fraction]
min = 0.01
max = 0.5

[control.dim_fraction]
max = 0.1

[control.liveliness]
min = 0.001

[control.flash_area_raw]
max = 0.1

[control.square_flashes]
max = 6

[control.phases_reached]
min = 1.0

[control.round_seconds]
min = 20
max = 120


