# Pong's feel: the paddle follows the body in depth (nearer is up, so the paddle's y follows "far"), and the dashed
# net is dim on purpose.
[fidelity]
input = "far"
xy = "left_xy"
axis = 1

[budgets."128x64".dim_fraction]
max = 0.3
reason = "the dashed centre net is deliberately dim (0, 0, 96) so it never competes with the ball and paddles"
